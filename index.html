.cbtn.go{flex:1 0 100%;text-align:center}
.rmeta{color:var(--mut);font-size:14px;margin:0 2px 12px}
.rsec{background:var(--card);border-radius:22px;padding:16px 18px;margin:0 0 14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.rsec h3{color:var(--pink);font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rsec.fold h3{cursor:pointer;margin:0;-webkit-tap-highlight-color:transparent}.rsec.fold.open h3{margin-bottom:8px}.rsec.fold h3 .arr{margin-left:auto;font-size:16px;transition:transform .2s;transform:rotate(-90deg)}.rsec.fold.open h3 .arr{transform:none}.rsec.fold .rut{display:none}.rsec.fold.open .rut{display:flex}
.rsec ul,.rsec ol{list-style:none;padding:0;margin:0}
.ring li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd);line-height:1.4;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ring li:last-child{border-bottom:0}
.rsec ul.rut{display:flex;flex-wrap:wrap;gap:8px}.rut li{background:var(--bg1);border:1px solid var(--bd);border-radius:14px;padding:7px 12px;font-size:14px;line-height:1.35}
.ring .tx{flex:1;min-width:0}
.ring li.miss .tx{text-decoration:line-through;opacity:.55}.ring li.miss .ck{background:var(--pink)}
.mt{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--pink);text-decoration:none!important;vertical-align:middle}
.swgo{display:block;width:100%;margin-top:10px;padding:12px 16px;border:0;border-radius:14px;background:var(--pink);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:left;line-height:1.35}
.swbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.swbar .swgo,.swbar .swno{flex:1 1 140px;margin:0}.swno{display:block;padding:12px 16px;border:2px solid var(--pink);border-radius:14px;background:var(--card);color:var(--pink);font:inherit;font-weight:700;cursor:pointer;text-align:left;line-height:1.35}
.swbar[hidden],.mt[hidden]{display:none}
.swp{flex:none;align-self:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--pink);font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.swh{color:var(--mut);font-size:13px;margin:0 4px 10px}
.ring .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink);flex:none;margin-top:0;display:grid;place-items:center;color:#fff;font-size:13px;line-height:1}
.rstep li{display:flex;gap:14px;align-items:flex-start;padding:11px 0;line-height:1.5}
.rstep .num{width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:14px}
.rp{margin:6px 0;line-height:1.5}
.m.rich{background:none;box-shadow:none;padding:0;max-width:100%;width:100%;white-space:normal}
.rtitle{font-size:20px;font-weight:700;color:var(--ink);margin:2px 4px 10px;line-height:1.25}

.tap{position:relative;cursor:pointer}
.camb{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:16px;pointer-events:none}
#isheetwrap{position:fixed;inset:0;background:rgba(10,8,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
#isheetwrap.on{display:flex}
.isheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.isheet h3{margin:0 0 4px;font-size:17px}
.isheet .cbtn{border:1px solid var(--bd);text-align:left;padding:13px 16px;width:100%}
.isheet .urlrow{margin-top:2px}
#imgMsg{font-size:13px;color:var(--pink);min-height:18px}
.typing{display:flex;gap:6px;align-items:center;padding:16px 18px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mut);animation:tb 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tb{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

.chathd{gap:10px;padding:10px 14px;border-bottom:0;border-radius:0 0 22px 22px;box-shadow:0 4px 18px rgba(0,0,0,.06);position:relative;z-index:2}
.chathd .rb{width:38px;height:38px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:18px;padding:0;flex:none}
.chathd .menubtn{font-size:20px}
.avw{position:relative;flex:none;margin-left:2px}
.avw::after{content:"";position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.chtx{flex:1;min-width:0}
.chtx b{font-size:16px;line-height:1.15}
.chtx .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.welcome{align-self:stretch;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 10px 8px}
.welcome .wm{width:76px;height:76px;border-radius:24px;box-shadow:0 6px 18px rgba(229,25,95,.18);margin-bottom:6px}
.welcome h3{margin:0;font-size:21px;line-height:1.2}
.welcome p{margin:0;color:var(--mut);font-size:14px;max-width:340px}
.wex{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;width:100%}
.wex .chip{font-size:14px;padding:9px 15px}

const TIME_WORDS={prep:'pr[ée]paration|prep(?:aration)?(?: time)?|preparaci[óo]n|vorbereitung(?:szeit)?|preparazione|prepara[çc][ãa]o',
  rest:'repos|rest(?:ing)?(?: time)?|reposo|descanso|ruhezeit|ruhen|riposo|repouso',

function recipeSections(txt){
  const secs=[{h:'',lines:[]}];let cur=secs[0];
  txt.split('\n').forEach(raw=>{const l=raw.trim();if(!l)return;
    const hm=l.match(/^#{1,3}\s+(.*)$/)||l.match(/^\*\*([^*]+)\*\*\s*:?$/);
    let h=hm?hm[1]:null;
    if(!h&&l.length<=40&&/[:：]$/.test(l)&&!/^[-•*\d]/.test(l))h=l;
    if(h){cur={h:h.replace(/\*\*/g,'').replace(/[:：]\s*$/,'').trim(),lines:[]};secs.push(cur);return}
    cur.lines.push(l.replace(/\*\*/g,''))});
  // Reply with no section heading at all (the chef forgot the format): rebuild
  // info / ingredients / steps from the numbered lines.
  if(secs.length===1||!secs.slice(1).some(x=>x.lines.length>1)){
    const L=secs.flatMap(x=>x.h?[x.h,...x.lines]:x.lines),isStep=l=>/^\d+[.)]\s+\S/.test(l);
    const first=L.findIndex(isStep);
    if(first>0&&L.filter(isStep).length>=2){
      const meta=/portion|personne|serving|people|porzion|persone|porç|pessoa|porcion|temps|time|\bmin\b|minute|heure|\bh\b|zeit|tempo|tiempo|cuisson|préparation/i;
      let i=0;const intro=[];
      if(L[0].length<80&&!/^[-•*\d]/.test(L[0])&&!isStep(L[0])){intro.push(L[0]);i=1} // titre sans « ## »
      while(i<first&&L[i].length<45&&meta.test(L[i])&&!/^[-•*]/.test(L[i])&&!/^\d+(?:[.,/]\d+)?\s*(g|kg|ml|cl|l|c\.|cuill|tasse|cup|oz|lb)\b/i.test(L[i])){intro.push(L[i]);i++}
      const ing=L.slice(i,first).map(x=>x.replace(/^[-•*]\s+/,'- ').replace(/^(?![-•*])/,'- '));
      const rest=L.slice(first);
      return [{h:'',lines:intro},{h:T().hIng,lines:ing},{h:T().hSteps,lines:rest.filter(isStep).concat(rest.filter(x=>!isStep(x)&&!/^[-•*]/.test(x)))}];
    }
  }
  return secs;
}

function recipeToText(r,st){
  const t=T(),L=['## '+(r.title||t.imUntitled)];
  if(r.servings)L.push(t.pServ+' : '+r.servings);
  if(r.time)L.push(t.pTime+' : '+r.time);
  if(r.temperature)L.push(t.pTemp+' : '+r.temperature);
  if(r.ingredients.length){L.push('','## '+t.hIng);r.ingredients.forEach(i=>L.push('- '+i))}
  if(r.steps.length){L.push('','## '+t.hSteps);r.steps.forEach((s,i)=>L.push((i+1)+'. '+s.replace(/^\s*\d+[.)]\s*/,'')))}
  if(r.notes)L.push('','## '+t.hNotes,r.notes);
  if(st.src==='link'&&st.host)L.push('',t.srcL+' : '+st.host);
  return L.join('\n');
}
function showPreview(st){
  imp=st;const t=T(),o=$('#impOut');o.innerHTML='';
  if(st.thumb){const im=document.createElement('img');im.className='imthumb';im.alt='';im.src=st.thumb;o.appendChild(im)}
  const b=document.createElement('div');b.className='rbody rtext';renderRecipe(b,recipeToText(st.recipe,st),st.recipe.title||t.imUntitled);o.appendChild(b);
  const c=document.createElement('p');c.className='imcheck';c.textContent=t.imCheck;o.appendChild(c);
  const row=document.createElement('div');row.className='cact';
  const ok=document.createElement('button');ok.className='cbtn go';ok.textContent='✓ '+t.imUse;ok.onclick=useImport;
  const no=document.createElement('button');no.className='cbtn';no.textContent=t.imCancel;no.onclick=resetImp;
  row.append(ok,no);o.appendChild(row);
  o.scrollIntoView&&o.scrollIntoView({block:'start'});
}
function useImport(){
  if(!imp)return;const t=T(),st=imp;
  openChat(null);log.innerHTML='';
  const msg=st.src==='link'?t.imMsgL.replace('{x}',st.host):t.imMsgP,text=recipeToText(st.recipe,st);
  hist=[{role:'user',content:'[UI] '+msg},{role:'assistant',content:text}];
  add('u',msg);add('a',text);
  pendingMeta={src:st.src,srcUrl:st.url||'',srcHost:st.host||'',photo:st.thumb||''};
  try{saveCurrent()}catch(e){}
  pendingMeta=null;imp=null;drawQuick();try{dishPic(log.lastElementChild,text)}catch(x){}
}

// ---------- Change a recipe's image (photo, gallery or link) ----------
let imgTarget=null;
function imgText(){const t=T();$('#imgTt').textContent=t.imgT;$('#imgCam').textContent='📷 '+t.imCam;$('#imgGal').textContent='🖼️ '+t.imGal;$('#imgUrl').placeholder=t.imgUrl;$('#imgGo').textContent=t.imgUse;$('#imgReset').textContent='↩︎ '+t.imgReset;$('#imgCancel').textContent=t.imCancel}
function imgMsg(x){$('#imgMsg').textContent=x||''}
function setImg(id,url){
  const a=loadH(),e=a.find(x=>x.id===id);if(!e)return false;
  if(url)e.img=url;else delete e.img;
  e.updatedAt=Date.now();return saveH(a);
}
function openImgSheet(id){
  const e=loadH().find(x=>x.id===id);if(!e)return;
  imgTarget=id;imgText();imgMsg('');$('#imgUrl').value='';$('#imgReset').style.display=e.img?'':'none';
  $('#isheetwrap').classList.add('on');
}
function closeImgSheet(){$('#isheetwrap').classList.remove('on');imgTarget=null}
function repaintImgViews(id){
  if(cardId===id&&curView==='card')openCard(id);
  const box=log.querySelector('.dphoto');
  if(box&&currentId===id){const b=box.previousElementSibling;box.remove();log.querySelectorAll('.chact').forEach(x=>x.remove());
    const m=hist.find(x=>x.role==='assistant'&&looksLikeRecipe(x.content));if(b&&m)dishPic(b,m.content)}
  drawHistory();drawFavs();
}
function finishImg(url){
  const id=imgTarget;if(!id)return;
  if(!setImg(id,url)){imgMsg(T().imgFull);return}
  closeImgSheet();repaintImgViews(id);toast(url?T().imgOk:T().imgReset);
}
async function imgFromFile(file){
  if(!file||!imgTarget)return;imgMsg(T().imWait);
  try{const pr=await prepareImage(file);finishImg(pr.mid)}catch(e){imgMsg(impMsg(e&&e.code))}
}
function imgFromUrl(){
  let u=$('#imgUrl').value.trim();if(!u)return;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  let x;try{x=new URL(u);if(!/^https?:$/.test(x.protocol)||!x.hostname.includes('.')||u.length>1500)throw 0}catch(e){imgMsg(T().e_badurl);return}
  imgMsg(T().imWait);const im=new Image();im.referrerPolicy='no-referrer';
  im.onload=()=>finishImg(x.href);im.onerror=()=>imgMsg(T().imgBad);im.src=x.href;
}

// Home search: ALL saved recipes, by text (title or category name) and/or the Favorites chip.
// While a search or filter is active the results replace the history block.
function drawHomeSearch(){
  const t=T(),a=loadH(),l=$('#hsres');l.innerHTML='';
  $('#homesearch').style.display=a.length?'':'none';
  if(!a.length){hsFav=false;hsCat=null;$('#hwrap').style.display='';return}
  const nz=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),q=nz($('#hsq').value.trim()),names=t.cats.split('|');
  const fb=$('#hsfav');fb.textContent='❤️ '+t.favs;fb.classList.toggle('on',hsFav);fb.onclick=()=>{hsFav=!hsFav;drawHomeSearch()};
  const active=!!q||hsFav||hsCat!==null;$('#hwrap').style.display=active?'none':'';
  if(!active)return;
  const hit=a.filter(e=>(!hsFav||e.fav)&&(hsCat===null||recipeCat(e)===hsCat)&&(!q||nz(e.title).includes(q)||nz(names[recipeCat(e)]).includes(q)));
  if(!hit.length){const p=document.createElement('div');p.className='empty';p.textContent=t.noresult;l.appendChild(p);return}
  const c=document.createElement('div');c.className='hscnt';c.textContent=hit.length+' '+(hit.length>1?t.resN:t.res1);l.appendChild(c);
  hit.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0)).forEach(e=>l.appendChild(rowFor(e,false,true)));
}

// « Back to top » button: shown in the chat and on the recipe card once the reader has scrolled down.
function topScroller(){return $('#chat').classList.contains('on')?log:$('#card').classList.contains('on')?$('#cardbody'):null}
function updTop(){
  const b=$('#totop'),sc=topScroller();if(!b)return;
  if(!sc||sc.scrollTop<400){b.classList.remove('on');return}
  const r=sc.getBoundingClientRect(),c4=sc===log?[...document.querySelectorAll('#quick .qcol')].pop():null;
  if(c4){ // chat: sits in the empty space under « Faster », so it never covers the content
    const c=c4.getBoundingClientRect(),low=Math.max(...[...$('#quick').querySelectorAll('.qcol')].map(x=>x.getBoundingClientRect().bottom));
    b.style.left=Math.round(c.left+c.width/2-22)+'px';b.style.top=Math.round(low-44)+'px'; // bottom of the tallest column, under « Faster »
  }else{ // recipe card: above the bottom bar, centered over its last icon (✨), never on top of it
    const nv=document.querySelector('nav'),nb=nv&&nv.offsetParent!==null?nv.querySelector('button:last-child'):null;
    if(nb){const n=nv.getBoundingClientRect(),c=nb.getBoundingClientRect();b.style.left=Math.round(c.left+c.width/2-22)+'px';b.style.top=Math.round(n.top-44-12)+'px'}
    else{b.style.left=(r.right-62)+'px';b.style.top=(r.bottom-62)+'px'}
  }
  b.classList.add('on');
}
{const b=document.createElement('button');b.id='totop';b.type='button';b.textContent='↑';b.setAttribute('aria-label','Top');
  b.onclick=()=>{const sc=topScroller();if(sc)sc.scrollTo({top:0,behavior:'smooth'})};document.body.appendChild(b);
  [log,$('#cardbody')].forEach(x=>x.addEventListener('scroll',updTop,{passive:true}));addEventListener('resize',updTop);
  if(window.ResizeObserver){const ro=new ResizeObserver(()=>updTop());[log,$('#quick'),$('#bar')].forEach(x=>ro.observe(x))}} // follow layout changes (new reply, filters button)
