<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef Claude – Recettes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
<style>
:root{--bg1:#eceaff;--bg2:#cdd6f4;--card:#fff;--ink:#16121a;--mut:#7b7684;--pink:#e5195f;--green:#84cc16;--dark:#15121a;--bd:rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1f1b33;--bg2:#12101d;--card:#272339;--ink:#f4f1fa;--mut:#a29cb3;--dark:#0b0910;--bd:rgba(255,255,255,.09)}}
:root[data-theme="dark"]{--bg1:#1f1b33;--bg2:#12101d;--card:#272339;--ink:#f4f1fa;--mut:#a29cb3;--dark:#0b0910;--bd:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:16px 18px 96px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mascot{width:48px;height:48px;border-radius:16px;flex:none}
.hi{color:var(--pink);font-weight:700;font-size:22px;line-height:1.1}
.sub{color:var(--mut);font-size:13px}
.ask{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px 6px 6px 16px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ask input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:0;min-width:0}
.ask button{background:var(--green);color:#10200a;font-weight:700;border-radius:999px;padding:8px 14px}
h2{font-size:16px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--pink);font-weight:600;font-size:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;width:100%;height:120px;border-radius:22px;padding:14px 16px;text-align:left;color:#fff;background:linear-gradient(120deg,#2b1d1d,#7a2d10);position:relative;overflow:hidden}
.hero .big{position:absolute;right:56px;top:6px;font-size:70px;opacity:.95}
.hero b{font-size:18px;display:block}
.hero span{font-size:12px;opacity:.8}
.go{width:34px;height:34px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:700;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--green);color:#10200a;border-color:var(--green);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rc{background:var(--card);border-radius:20px;overflow:hidden;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.rc .pic{height:84px;display:grid;place-items:center;font-size:44px}
.rc div.t{padding:8px 12px 12px;font-weight:600;font-size:14px}
.rc div.t span{display:block;color:var(--mut);font-weight:400;font-size:12px}
.chefs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.chef{flex:none;width:150px;background:var(--card);border-radius:20px;padding:12px;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.chef i{font-style:normal;font-size:30px;display:block}
.chef b{display:block;font-size:14px}
.chef span{color:var(--mut);font-size:12px}
.chef em{display:block;margin-top:6px;color:var(--pink);font-style:normal;font-weight:700;font-size:12px}
#chat.on~nav{display:none}
nav{position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-around;background:var(--card);border-radius:999px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
nav button{padding:6px 22px;font-size:22px;opacity:.5}
nav button.on{opacity:1}
nav .mid{width:54px;height:54px;border-radius:50%;background:var(--green);margin-top:-26px;display:grid;place-items:center;font-size:24px;opacity:1;padding:0;box-shadow:0 4px 12px rgba(132,204,22,.5)}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.chead .back{font-size:22px;padding:0 6px}
.chead b{display:block;line-height:1.2}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:5px}
.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.a h3{margin:.7em 0 .2em;font-size:15px;color:var(--pink)}
.a h3:first-child{margin-top:0}
#quick{display:flex;gap:8px;overflow-x:auto;padding:6px 14px}
#bar{display:flex;gap:8px;padding:8px 14px 12px}
#inp{flex:1;font:inherit;padding:11px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--ink);min-width:0}
#send{background:var(--green);color:#10200a;font-weight:700;border-radius:999px;padding:0 18px}
#send:disabled{opacity:.5}
#mic,#home2{width:44px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-size:18px}
#mic.on{background:var(--pink);animation:p 1s infinite}
@keyframes p{50%{opacity:.6}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mascot" viewBox="0 0 512 512">
<rect width="512" height="512" rx="112" fill="#e4e1ff"/>
<path d="M120 520 Q130 405 256 396 Q382 405 392 520 Z" fill="#fff"/>
<path d="M214 392 Q256 420 298 392 L290 418 Q256 440 222 418 Z" fill="#e5195f"/>
<circle cx="256" cy="302" r="92" fill="#ffdcbf"/>
<ellipse cx="222" cy="306" rx="10" ry="14" fill="#2a2420"/><ellipse cx="290" cy="306" rx="10" ry="14" fill="#2a2420"/>
<ellipse cx="196" cy="338" rx="16" ry="10" fill="#ff9aa8" opacity=".6"/><ellipse cx="316" cy="338" rx="16" ry="10" fill="#ff9aa8" opacity=".6"/>
<path d="M232 340 Q256 366 280 340" fill="none" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
<g fill="#fff" stroke="#d9ddf0" stroke-width="3"><circle cx="186" cy="168" r="52"/><circle cx="326" cy="168" r="52"/><circle cx="256" cy="136" r="66"/><rect x="170" y="176" width="172" height="78" rx="18"/></g>
<rect x="170" y="228" width="172" height="26" rx="12" fill="#e5195f"/>
</symbol></defs></svg>

<div id="app">
  <section class="view on" id="home">
    <div class="scroll">
      <div class="top">
        <svg class="mascot"><use href="#mascot"/></svg>
        <div><div class="hi">Bonjour !</div><div class="sub">Votre chef de poche, propulsé par l’IA</div></div>
      </div>
      <div class="ask"><input id="hq" placeholder="Que voulez-vous cuisiner ?"><button id="hgo">Go</button></div>
      <h2>Recette du jour</h2>
      <button class="hero" data-q="Donne-moi une recette de rosbif"><span class="big">🥩</span><div><b>Rosbif</b><span>Français · dîner · 45 min</span></div><div class="go">›</div></button>
      <h2>Thèmes <small id="thn"></small></h2>
      <div class="chips" id="themes"></div>
      <div class="grid" id="grid"></div>
      <h2>Chefs IA</h2>
      <div class="chefs" id="chefs"></div>
    </div>
  </section>

  <section class="view" id="chat">
    <div class="chead"><button class="back" id="back" aria-label="Accueil">🏠</button><svg class="mascot" style="width:38px;height:38px"><use href="#mascot"/></svg><div><b id="cname">Chef Claude</b><span class="sub" id="cdesc">Cuisine du monde</span></div></div>
    <div id="log"></div>
    <div id="quick"></div>
    <div id="bar"><button id="home2" aria-label="Accueil">🏠</button><input id="inp" placeholder="Ex. : je n’ai pas de persil, j’ai du Cajun" autocomplete="off"><button id="mic" aria-label="Parler">🎤</button><button id="send">Envoyer</button></div>
  </section>

  <nav>
    <button id="n1" class="on" aria-label="Accueil">🏠</button>
    <button class="mid" id="n2" aria-label="Chat">💬</button>
    <button id="n3" aria-label="Aide">✨</button>
  </nav>
</div>

<script>
const THEMES=["Tout","Anniversaire","Petit-déj","Dîner","Végé"];
const RECIPES=[
{t:"Pizza Margherita",e:"🍕",c:"Dîner",m:"30 min",bg:"#fde4d8"},
{t:"Pancakes moelleux",e:"🥞",c:"Petit-déj",m:"20 min",bg:"#fdf1c9"},
{t:"Gâteau au chocolat",e:"🎂",c:"Anniversaire",m:"50 min",bg:"#f6dbe8"},
{t:"Curry de légumes",e:"🍛",c:"Végé",m:"35 min",bg:"#dcefc9"},
{t:"Pâtes carbonara",e:"🍝",c:"Dîner",m:"15 min",bg:"#fde4d8"},
{t:"Œufs brouillés",e:"🍳",c:"Petit-déj",m:"10 min",bg:"#fdf1c9"},
{t:"Cupcakes",e:"🧁",c:"Anniversaire",m:"40 min",bg:"#f6dbe8"},
{t:"Buddha bowl",e:"🥗",c:"Végé",m:"25 min",bg:"#dcefc9"}];
const CHEFS=[
{n:"Giulia",e:"🍝",d:"Cuisine italienne",p:"Tu es Giulia, cheffe italienne passionnée : tu privilégies les recettes italiennes authentiques."},
{n:"Hiro",e:"🍣",d:"Cuisine japonaise",p:"Tu es Hiro, chef japonais : tu privilégies les recettes japonaises et leurs techniques précises."},
{n:"Marcel",e:"🥖",d:"Cuisine française",p:"Tu es Marcel, chef français : tu privilégies la cuisine française traditionnelle et de bistrot."}];
const QUICK=["Pour 2 personnes","Pour 6 personnes","Sans gluten","Plus rapide","Version végétarienne"];
const $=s=>document.querySelector(s);
const log=$('#log'),inp=$('#inp'),sendB=$('#send');
let hist=[],sample=null,busy=false,persona="",theme="Tout";

function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));$('#n1').classList.toggle('on',id==='home')}
function drawGrid(){
  $('#themes').innerHTML='';THEMES.forEach(t=>{const b=document.createElement('button');b.className='chip'+(t===theme?' on':'');b.textContent=t;b.onclick=()=>{theme=t;drawGrid()};$('#themes').appendChild(b)});
  $('#grid').innerHTML='';RECIPES.filter(r=>theme==="Tout"||r.c===theme).forEach(r=>{
    const b=document.createElement('button');b.className='rc';
    const p=document.createElement('div');p.className='pic';p.style.background=r.bg;p.textContent=r.e;
    const t=document.createElement('div');t.className='t';t.textContent=r.t;const s=document.createElement('span');s.textContent=r.c+" · "+r.m;t.appendChild(s);
    b.append(p,t);b.onclick=()=>start("Donne-moi une recette de "+r.t.toLowerCase());$('#grid').appendChild(b)});
}
function drawChefs(){CHEFS.forEach(c=>{const b=document.createElement('button');b.className='chef';
  const i=document.createElement('i');i.textContent=c.e;const n=document.createElement('b');n.textContent="Chef "+c.n;const d=document.createElement('span');d.textContent=c.d;const e=document.createElement('em');e.textContent="Discuter ›";
  b.append(i,n,d,e);b.onclick=()=>openChat(c);$('#chefs').appendChild(b)})}
function render(el,t){el.innerHTML='';t.split('\n').forEach(l=>{if(l.startsWith('## ')){const h=document.createElement('h3');h.textContent=l.slice(3);el.appendChild(h)}else el.appendChild(document.createTextNode(l+'\n'))})}
function add(cls,t){const d=document.createElement('div');d.className='m '+cls;if(cls==='u')d.textContent=t;else render(d,t);log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function drawQuick(){const q=$('#quick');q.innerHTML='';QUICK.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>send(t);q.appendChild(b)})}
function openChat(chef){
  hist=[];log.innerHTML='';$('#quick').innerHTML='';
  persona=chef?chef.p:"";$('#cname').textContent=chef?"Chef "+chef.n:"Chef Claude";$('#cdesc').textContent=chef?chef.d:"Cuisine du monde";
  add('a',"Que voulons-nous cuisiner ? Demandez une recette, puis adaptez-la : « je n’ai pas de persil, j’ai du Cajun », « redonne-la pour 2 »…");
  show('chat');
}
function start(q){openChat(null);send(q)}
async function send(text){
  text=(text||inp.value).trim();if(!text||busy)return;
  inp.value='';add('u',text);hist.push({role:'user',content:text});
  const out=add('a','…');busy=true;sendB.disabled=true;
  try{
    const code=()=>{try{return localStorage.getItem('code')||''}catch(e){return ''}};
    const call=()=>fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-code':code()},body:JSON.stringify({messages:hist,persona})});
    let res=await call();
    if(res.status===401){const c=prompt("Code d’accès :");if(c){try{localStorage.setItem('code',c)}catch(e){}res=await call()}}
    if(!res.ok)throw {code:res.status===429?'rate_limited':'err'};
    const j=await res.json();
    render(out,j.text);hist.push({role:'assistant',content:j.text});drawQuick();
  }catch(e){
    hist.pop();
    render(out,e&&e.code==='rate_limited'?"Trop de demandes, réessayez dans un instant.":e&&e.code==='not_granted'?"Autorisation refusée : acceptez l’accès à Claude pour utiliser l’appli.":"Une erreur est survenue, réessayez.");
  }finally{busy=false;sendB.disabled=false;log.scrollTop=log.scrollHeight}
}
document.querySelector('.hero').onclick=e=>start(e.currentTarget.dataset.q);
$('#hgo').onclick=()=>{const v=$('#hq').value.trim();if(v){$('#hq').value='';start(v)}};
$('#hq').addEventListener('keydown',e=>{if(e.key==='Enter')$('#hgo').click()});
$('#back').onclick=()=>show('home');
$('#home2').onclick=()=>show('home');
$('#n1').onclick=()=>show('home');
$('#n2').onclick=()=>{if(!log.children.length)openChat(null);else show('chat')};
$('#n3').onclick=()=>start("Surprends-moi avec une recette facile pour ce soir");
sendB.onclick=()=>send();
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('#mic');
if(!SR)mic.style.display='none';else{let rec=null;mic.onclick=()=>{if(rec){rec.stop();return}try{rec=new SR();rec.lang='fr-FR';rec.interimResults=true;rec.onresult=e=>{inp.value=Array.from(e.results).map(r=>r[0].transcript).join('')};rec.onend=()=>{rec=null;mic.classList.remove('on');if(inp.value.trim())send()};rec.onerror=()=>{rec=null;mic.classList.remove('on')};mic.classList.add('on');rec.start()}catch(e){rec=null;mic.style.display='none'}}}
drawGrid();drawChefs();
</script>
</body>
</html>
