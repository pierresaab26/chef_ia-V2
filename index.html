function addSelectBar(box,items,from,rk){

      const h=mk('p','cih','➕ '+t.ciInvite);h.style.cssText='font-weight:600;color:var(--ink);margin:0 2px 8px';s2.append(h,row,ih,al)}
    body.append(s2)};
  const paint=()=>{paintTabs();body.textContent='';(ciTab==='a'?tabA:ciTab==='m'?tabM:tabR)()};
  paint();
  if(ntData&&ntData.unread){(ntData.items||[]).forEach(x=>{if(x.at>(ntData.seen||0)&&(x.k==='appok'||x.k==='appno'))pubResync(x)});capi('POST','',{act:'seen'},'/api/circle',true).catch(()=>{});ntData.unread=0;setTimeout(paintNotes,0)}
  if(!/^https?:/.test(location.href)){st.load=false;st.err=true;paint();return}
  try{const[r1,r2]=await Promise.all([capi('GET','',null,'/api/circle'),capi('GET','?feed=1',null,'/api/circle')]);if(!r1.ok||!r2.ok)throw 0;
    const who=await r1.json(),fd=await r2.json();if(curView!=='circle')return;ciData=who;st.who=who;st.fd=fd;if(nick()&&who.name!==nick())syncNick(true)}catch(x){st.err=true}
  st.load=false;if(curView==='circle')paint()}
async function inviteCircle(btn,mode){const t=T();if(!nick())await askNick();if(!nick())return;btn.disabled=true;
  // v298: mode 'copy' (computer) copies the invitation; the clipboard write starts right away (Safari only allows it inside the click) and gets its text once the server answers
  const mk=async()=>{if(nick()!==(localStorage.getItem('nickSync')||''))await syncNick();const r=await capi('POST','',{act:'invite'},'/api/circle');if(!r.ok)throw 0;const{code}=await r.json();const link=location.origin+'/?c='+code;return{link,txt:t.ciInvTxt+' '+nick()+'\n'+link}};
  try{
    if(mode==='copy'){const pr=mk();let ok=false;
      if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){try{await navigator.clipboard.write([new ClipboardItem({'text/plain':pr.then(v=>new Blob([v.txt],{type:'text/plain'}))})]);ok=true}catch(x){}}
      const v=await pr;if(!ok){try{await navigator.clipboard.writeText(v.txt);ok=true}catch(x){}}toast(ok?t.ciCopied:v.link);return}
    const v=await mk();
    if(navigator.share){try{await navigator.share({text:v.txt});return}catch(x){if(x&&x.name==='AbortError')return}} // v298: no « title »: the Mac glued it to the text (« Chef IA and Rejoins… »)
    let ok=false;try{await navigator.clipboard.writeText(v.txt);ok=true}catch(x){}toast(ok?t.ciCopied:v.link)}catch(x){toast(t.ciErr)}finally{btn.disabled=false}}
async function joinCircle(code){track('circle_join');const t=T();try{history.replaceState(null,'',location.pathname)}catch(x){}
  /* v329: the same link lets in a friend who has no access yet (personal code from the server, counted on the inviter's 3 new friends) */
  try{const r0=await capi('POST','',{act:'redeem',code},'/api/circle',true);let d0={};try{d0=await r0.json()}catch(x){}
    if(r0.ok&&d0.code){try{localStorage.setItem('code',d0.code)}catch(x){}}
    else if(r0.status===409&&d0.error==='limit'){toast(t.invFull);return}
    else if(r0.status===404){toast(t.ciBadLink);return}}catch(x){}
  if(!nick())await askNick();if(nick())await syncNick();
  try{const r=await capi('POST','',{act:'join',code},'/api/circle');let d={};try{d=await r.json()}catch(x){}
    if(r.ok){toast((d.already?t.ciAlready:t.ciJoined).replace('{n}',d.name||t.ciNoName));drawCircle();show('circle');return}
    toast(d.error==='self'?t.ciSelf:d.error==='full'?t.ciFull:r.status===404||r.status===400?t.ciBadLink:t.ciErr)}catch(x){toast(t.ciErr)}}

{let cc='';try{cc=(new URLSearchParams(location.search).get('c')||'').trim().toLowerCase().slice(0,16)}catch(e){}

/* v328: every night at midnight (device time), and when the app is reopened on a new day, check whether a newer version is online; reload only when it differs AND nobody is typing or waiting for the chef */
(function(){
  if(!/^https?:$/.test(location.protocol)||typeof claude!=='undefined')return;
  let day=new Date().toDateString(),pend=null,tm=null;
  const idle=()=>!busy&&!document.querySelector('.dlgw')&&![...document.querySelectorAll('textarea,input')].some(x=>/^(text|search|textarea|)$/.test(x.type||'')&&x.value&&x.value.trim());
  const go=()=>{if(!pend)return;if(!idle()){clearTimeout(tm);tm=setTimeout(go,30000);return}
    try{const k='verReload',last=JSON.parse(sessionStorage.getItem(k)||'null');if(last&&last.v===pend&&Date.now()-last.t<600000)return;sessionStorage.setItem(k,JSON.stringify({v:pend,t:Date.now()}))}catch(e){}
    location.reload()};
  const check=async()=>{day=new Date().toDateString();try{const r=await fetch('/?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const APP_VERSION='(v\d+)'/);if(m&&m[1]!==APP_VERSION){pend=m[1];go()}}catch(e){}};
  const arm=()=>{const n=new Date(),next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,0,0);setTimeout(()=>{check();arm()},next-n+Math.floor(Math.random()*300000))};
  arm();
  document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(new Date().toDateString()!==day)check();else if(pend)go()});
})();
